
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Button Website</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎉 Button Playground</h1>
        <p>Click the buttons and see what happens!</p>

        <div class="message" id="message">
            Welcome! Choose a button below. 😎
        </div>

        <div class="buttons">
            <button id="funButton">😂 Make Me Laugh</button>

            <button id="colorButton">🎨 Change Color</button>

            <button id="textButton">✨ Change My Text</button>

            <button id="countButton">👆 Click Counter</button>
        </div>

        <p class="counter">
            Total clicks: <span id="clicks">0</span>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
